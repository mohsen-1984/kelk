<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">

         script, handler or eval); inline styles (the builders' and MathJax's); images also from the web (a document may
         name a public image); workers from the app or a blob; no plugin, no <base>, no form submission. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kelk – Markdown to Word, PowerPoint, PDF and HTML and back, right-to-left first</title>
    <meta name="description" content="Kelk: convert Markdown (GFM) to Word DOCX, Word DOC (MHTML), PowerPoint PPTX slides, PDF and standalone HTML — and Word, HTML and PDF back to Markdown — entirely client-side in your browser. Right-to-left first (Persian, Arabic, Hebrew, Urdu) and every left-to-right language; LaTeX formulas; offline, no upload, open source.">
    <meta name="keywords" content="markdown to docx, markdown to pptx, markdown to powerpoint, markdown slides, markdown to pdf, markdown to word, markdown to html, docx to markdown, pdf to markdown, LaTeX, MathJax, Word equations, GFM, RTL, bidi, Persian, Farsi, Arabic, Hebrew, Urdu, client-side, offline">
    <meta name="author" content="mhn.com@gmail.com">
    <meta name="contributor" content="Anthropic Claude Opus 5.5">
    <meta name="theme-color" content="#1f6f5c">
    <link rel="canonical" href="https://mohsen-1984.github.io/kelk/">

    <!-- link previews: Open Graph (Telegram, WhatsApp, LinkedIn, Facebook …) and X / Twitter -->

    <meta property="og:site_name" content="Kelk">
    <meta property="og:title" content="Kelk – Markdown to Word, PowerPoint, PDF and HTML and back, right-to-left first">

    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Kelk – کِلک: Markdown to Word, PowerPoint, PDF and HTML">
    <meta property="og:locale" content="fa_IR">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:locale:alternate" content="ar_AR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kelk – Markdown to Word, PowerPoint, PDF and HTML and back, right-to-left first">
    <meta name="twitter:description" content="Markdown to DOCX, DOC, PPTX slides, PDF and HTML — and back — in your browser. Right-to-left first, LaTeX formulas, offline, open source.">
    <meta name="twitter:image" content="https://mohsen-1984.github.io/kelk/assets/og-image.png">
    <meta name="twitter:image:alt" content="Kelk – کِلک: Markdown to Word, PowerPoint, PDF and HTML">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cg transform='translate(4 4) rotate(40 12 12)'%3E%3Cpath d='M7.4 2.2h9.2v5.6c0 1.6-.7 2.8-1.5 4.1L12 21.8l-3.1-9.9c-.8-1.3-1.5-2.5-1.5-4.1z' fill='%23fff'/%3E%3Cpath d='M12 12.6v8' stroke='%231f6f5c' stroke-width='1.3' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='11.2' r='1.5' fill='%231f6f5c'/%3E%3C/g%3E%3C/svg%3E">

    <!-- before the stylesheets: <html lang dir> and the theme from the stored page settings (no wrong-language flash) -->
    <script src="scripts/boot.js"></script>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/preview.css">
    <link rel="stylesheet" href="vendor/highlight.js/github.min_11.11.1.css">
</head>
<body>
<div class="app">

    <!-- ═══ top bar ═══ -->
    <header class="topbar">
        <div class="brand">
            <!-- the mark: hover, focus or a tap shows what it is (a reed pen's nib) -->
            <span class="glyph-wrap">
                <button class="glyph" type="button" aria-describedby="brand-tip" data-i18n-attr="aria-label:appName">
                    <!-- a reed pen's cut nib (kelk = the reed pen), solid — unlike the editor's outlined pencil -->
                    <svg viewBox="0 0 24 24">
                        <g transform="rotate(40 12 12)">
                            <path d="M7.4 2.2h9.2v5.6c0 1.6-.7 2.8-1.5 4.1L12 21.8l-3.1-9.9c-.8-1.3-1.5-2.5-1.5-4.1z" fill="currentColor"/>
                            <path d="M12 12.6v8" style="stroke:var(--accent)" stroke-width="1.3" stroke-linecap="round"/>
                            <circle cx="12" cy="11.2" r="1.5" style="fill:var(--accent)"/>
                        </g>
                    </svg>
                </button>
                <span class="brand-tip" id="brand-tip" role="tooltip" data-i18n="logoTip"></span>
            </span>
            <div>
                <div class="title-row">
                    <h1 data-i18n="appName">کِلک</h1>
                    <!-- the version (K.config.version), a link to its release notes -->
                    <a class="app-version" id="app-version" dir="ltr" target="_blank" rel="noopener noreferrer" data-i18n-attr="title:versionTip"></a>
                </div>
                <!-- the tagline, its two-way conversion drawn as an icon (the same in every font, unlike ⇆);
                     as text in the page title (i18n.apply) and the meta tags -->
                <div class="sub"><span data-i18n="tagFrom"></span> <i class="tag-arrows" data-lucide="arrow-left-right" aria-hidden="true"></i><span class="sr-only" data-i18n="tagBoth"></span> <span data-i18n="tagTo"></span></div>
            </div>
        </div>
        <div class="spacer"></div>
        <!-- the page's own controls: one group that stays on one line (wraps under the name as a whole) -->
        <div class="top-tools">
            <span class="lang-switch" id="lang-switch" role="group" aria-label="Language"><i data-lucide="languages"></i></span>
            <span class="sep" aria-hidden="true"></span>
            <button class="btn ghost icon" id="btn-theme" type="button" data-i18n-attr="title:theme;aria-label:theme"></button>
            <button class="btn ghost icon layout-toggle" id="btn-layout" type="button"></button>
            <button class="btn ghost icon" id="btn-keys" type="button" data-i18n-attr="title:shortcuts;aria-label:shortcuts"><i data-lucide="keyboard"></i></button>
            <button class="btn ghost icon" id="btn-help" type="button" data-i18n-attr="title:help;aria-label:help"><i data-lucide="circle-help"></i></button>
        </div>
    </header>

    <!-- ═══ workspace ═══ -->
    <main class="workspace" id="workspace">

        <!-- editor -->
        <section class="panel editor-panel" aria-labelledby="h-editor">
            <button class="rail" id="editor-rail" type="button" aria-controls="editor-body" data-i18n-attr="title:openEditor;aria-label:openEditor">
                <span class="flip-rtl"><i data-lucide="panel-left-open"></i></span><span class="rail-label" data-i18n="editor"></span>
            </button>
            <div class="panel-head pane-head">
                <h2 id="h-editor"><i data-lucide="pencil-line"></i><span data-i18n="editor"></span></h2>
                <div class="actions">
                    <button class="btn ghost icon" id="btn-sample" type="button" data-i18n-attr="title:sampleHint;aria-label:sampleHint"><i data-lucide="book-open"></i></button>
                    <button class="btn cap" id="btn-import" type="button" data-i18n-attr="title:import;aria-label:import"><i data-lucide="file-up"></i><span data-i18n="import"></span></button>
                    <button class="btn cap" id="btn-paste" type="button" data-i18n-attr="title:paste;aria-label:paste"><i data-lucide="clipboard-paste"></i><span data-i18n="paste"></span></button>
                    <button class="btn ghost icon" id="btn-replace" type="button" data-i18n-attr="title:replacePaste;aria-label:replacePaste"><i data-lucide="replace-all"></i></button>
                    <span class="btn-pair">
                        <button class="btn ghost icon flip-rtl-btn" id="btn-undo" type="button" disabled data-i18n-attr="title:undo;aria-label:undo"><i data-lucide="undo-2"></i></button>
                        <button class="btn ghost icon flip-rtl-btn" id="btn-redo" type="button" disabled data-i18n-attr="title:redo;aria-label:redo"><i data-lucide="redo-2"></i></button>
                    </span>
                    <button class="btn ghost icon btn-max" id="max-editor" type="button" data-max="editor" data-i18n-attr="title:maximize;aria-label:maximize"><i data-lucide="maximize-2"></i></button>
                    <button class="btn soft danger icon" id="btn-clear" type="button" data-i18n-attr="title:clear;aria-label:clear"><i data-lucide="eraser"></i></button>
                </div>
            </div>
            <div class="pane-body editor-body" id="editor-body">
                <div class="sample-note" id="sample-note" role="note" hidden>
                    <i data-lucide="lightbulb"></i><span data-i18n="sampleNote"></span>
                    <button class="btn soft danger" id="sample-note-clear" type="button"><i data-lucide="eraser"></i><span data-i18n="clear"></span></button>
                </div>
                <!-- what a PDF import could not read in full, or why the Slides view did not open (Kelk.ui.report, scripts/report.js) -->
                <section class="import-report" id="import-report" role="region" aria-labelledby="import-report-title" tabindex="-1" hidden>
                    <div class="report-head">
                        <h3 id="import-report-title"><i data-lucide="file-text"></i><span data-i18n="rep_title"></span></h3>
                        <span class="report-name" id="import-report-name" dir="auto"></span>
                        <span class="report-brief" id="import-report-brief"></span>
                        <button class="btn ghost icon" id="import-report-toggle" type="button" aria-controls="import-report-body" aria-expanded="true"><i data-lucide="chevron-up"></i></button>
                        <button class="btn ghost icon" id="import-report-close" type="button" data-i18n-attr="title:rep_close;aria-label:rep_close"><i data-lucide="x"></i></button>
                    </div>
                    <div class="report-body" id="import-report-body" role="group" aria-labelledby="import-report-title" tabindex="0"></div>
                    <div class="report-actions">
                        <button class="btn soft" id="report-safe" type="button" aria-describedby="report-safe-hint" hidden><i data-lucide="rotate-ccw"></i><span data-i18n="rep_safe"></span></button>
                        <button class="btn" id="report-copy" type="button"><i data-lucide="copy"></i><span data-i18n="rep_copy"></span></button>
                        <p class="report-safe-hint" id="report-safe-hint" data-i18n="rep_safeHint" hidden></p>
                    </div>
                </section>
                <div class="editor-wrap">
                    <textarea id="editor" dir="auto" spellcheck="false" data-i18n-attr="placeholder:editorPlaceholder;aria-label:editor"></textarea>
                    <div class="dropzone-overlay"><span data-i18n="dropHere"></span></div>
                </div>
                <div class="panel-foot editor-foot">
                    <div class="stats" aria-live="polite">
                        <span><span data-i18n="words"></span>: <b id="st-words">0</b></span>
                        <span><span data-i18n="chars"></span>: <b id="st-chars">0</b></span>
                        <span><span data-i18n="size"></span>: <b id="st-size" dir="ltr">0 KB</b></span>
                        <span id="st-file" hidden><span data-i18n="file"></span>: <b id="st-file-name" dir="auto"></b></span>
                    </div>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn icon" id="btn-copy-editor" type="button" data-i18n-attr="title:copyMd;aria-label:copyMd"><i data-lucide="copy"></i></button>
                    <button class="btn soft" id="btn-md" type="button" data-export="md" data-i18n-attr="title:mdHint"><i data-lucide="file-down"></i>MD</button>
                </div>
            </div>
            <input type="file" id="file-import" hidden multiple accept=".md,.markdown,.txt,.html,.htm,.docx,.pdf,.zip,text/markdown,text/plain,text/html,application/pdf,application/zip">
        </section>

        <!-- preview -->
        <section class="panel preview-panel" aria-labelledby="h-preview">
            <div class="panel-head">
                <h2 id="h-preview"><i data-lucide="eye"></i><span data-i18n="preview"></span></h2>
                <!-- the same Markdown as a document or as slides (Kelk.slides; lib/SLIDES.md) -->
                <div class="segmented view-toggle" role="group" data-i18n-attr="aria-label:viewToggle;title:viewToggle">
                    <button type="button" data-view="document" aria-pressed="true"><i data-lucide="file-text"></i><span data-i18n="viewDocument"></span></button>
                    <button type="button" data-view="slides" aria-pressed="false"><i data-lucide="presentation"></i><span data-i18n="viewSlides"></span></button>
                </div>
                <div class="actions">
                    <span class="slides-count slides-only" id="slides-count"></span>
                    <button class="btn ghost icon slides-only" id="btn-present" type="button" data-i18n-attr="title:present;aria-label:present"><i data-lucide="monitor-play"></i></button>
                    <button class="btn ghost icon doc-only" id="btn-copy-preview" type="button" data-i18n-attr="title:copy;aria-label:copy"><i data-lucide="copy"></i></button>
                    <button class="btn ghost icon btn-max" id="max-preview" type="button" data-max="preview" data-i18n-attr="title:maximize;aria-label:maximize"><i data-lucide="maximize-2"></i></button>
                </div>
            </div>
            <div class="preview-scroll">
                <article id="preview" class="doc" data-i18n-attr="data-empty:previewEmpty"></article>
                <div id="slides" class="slides-pane" hidden data-i18n-attr="data-empty:previewEmpty"></div>
            </div>
            <div class="panel-foot export-foot">
                <div class="namebox" data-i18n-attr="title:fileName">
                    <input class="stem" id="nb-stem" dir="auto" spellcheck="false" data-i18n-attr="aria-label:fileName">
                    <span class="ext" aria-disabled="true" data-i18n-attr="title:extHint"><span id="nb-ext">.docx</span></span>
                </div>
                <div class="export-bar" role="group" data-i18n-attr="aria-label:exportAs">
                    <button class="btn primary" type="button" data-export="docx" data-i18n-attr="title:docxHint"><i data-lucide="file-text"></i>DOCX</button>
                    <button class="btn soft" type="button" data-export="pdf" data-i18n-attr="title:pdfHint"><i data-lucide="file-type"></i>PDF</button>
                    <!-- PPTX in the Slides view only (DOCX, PDF, HTML, DOC in the document view: slides.js applyView) -->
                    <button class="btn primary" type="button" data-export="pptx" data-i18n-attr="title:pptxHint" hidden><i data-lucide="presentation"></i>PPTX</button>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn" type="button" data-export="html" data-i18n-attr="title:htmlHint"><i data-lucide="code-xml"></i>HTML</button>
                    <button class="btn ghost" type="button" data-export="doc" data-i18n-attr="title:docHint"><i data-lucide="file"></i>DOC</button>
                </div>
            </div>
        </section>

        <!-- settings (export profile) -->
        <aside class="panel settings" aria-labelledby="h-settings">
            <button class="rail" id="pane-rail" type="button" aria-controls="pane-body" data-i18n-attr="title:openSettings;aria-label:openSettings">
                <i data-lucide="sliders-horizontal"></i><span class="rail-label" data-i18n="settings"></span><i class="rail-chev" data-lucide="square-chevron-down"></i>
            </button>
            <div class="panel-head pane-head">
                <h2 id="h-settings"><i data-lucide="sliders-horizontal"></i><span data-i18n="settings"></span></h2>
                <div class="actions">
                    <!-- every setting back to its default (undo in the toast); also in the App group -->
                    <button class="btn ghost icon danger" id="settings-reset" type="button" data-i18n-attr="title:resetAllSettings;aria-label:resetAllSettings"><i data-lucide="rotate-ccw"></i></button>
                    <span class="sep" aria-hidden="true"></span>
                    <span class="btn-pair">
                        <button class="btn ghost icon" id="groups-open" type="button" data-i18n-attr="title:expandAll;aria-label:expandAll"><i data-lucide="list-chevrons-up-down"></i></button>
                        <button class="btn ghost icon" id="groups-close" type="button" data-i18n-attr="title:collapseAll;aria-label:collapseAll"><i data-lucide="list-chevrons-down-up"></i></button>
                    </span>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn ghost icon pane-toggle" id="pane-close" type="button" data-i18n-attr="title:closeSettings;aria-label:closeSettings"><span class="flip-rtl wide-only"><i data-lucide="panel-right-close"></i></span><span class="narrow-only"><i data-lucide="square-chevron-up"></i></span></button>
                </div>
            </div>
            <div class="pane-body" id="pane-body">

                <details class="group">
                    <summary><i data-lucide="file-text"></i><span data-i18n="gDocument"></span></summary>
                    <div class="fields">
                        <div class="field"><span class="label-row"><label for="f-title" data-i18n="docTitle"></label>
                            <button class="mini" type="button" data-reset="document.title" hidden data-i18n-attr="title:resetDefault;aria-label:resetDefault"><i data-lucide="rotate-ccw"></i></button></span>
                            <input type="text" id="f-title" dir="auto" data-setting="document.title"></div>
                        <div class="row2">
                            <div class="field"><span class="label-row"><label for="f-edition" data-i18n="docEdition"></label>
                                <button class="mini" type="button" data-reset="document.edition" hidden data-i18n-attr="title:editionReset;aria-label:editionReset"><i data-lucide="rotate-ccw"></i></button></span>
                                <input type="text" id="f-edition" dir="auto" data-setting="document.edition"></div>
                            <label class="field"><span data-i18n="docAuthor"></span><input type="text" dir="auto" data-setting="document.author"></label>
                        </div>
                        <label class="field"><span data-i18n="docLink"></span><input type="text" dir="ltr" data-setting="document.link" placeholder="example.com / name@example.com"></label>
                        <div class="field"><span class="hint" data-i18n="optional"></span></div>
                        <label class="field"><span data-i18n="docDirection"></span>
                            <select data-setting="direction">
                                <option value="auto" data-i18n="dirAuto"></option>
                                <option value="rtl" data-i18n="dirRtl"></option>
                                <option value="ltr" data-i18n="dirLtr"></option>
                            </select></label>
                        <div class="row2">
                            <label class="check"><input type="checkbox" data-setting="toc.enabled"><span data-i18n="tocEnabled"></span></label>
                            <label class="field"><span data-i18n="tocLevels"></span>
                                <select data-setting="toc.levels"><option value="1">H1</option><option value="2">H1–H2</option><option value="3">H1–H3</option></select></label>
                        </div>
                    </div>
                </details>

                <!-- every font in one place: one choice for the preview and every output, or other fonts for DOCX and PPTX -->
                <details class="group" id="fonts-group">
                    <summary><i data-lucide="type"></i><span data-i18n="gFonts"></span></summary>
                    <div class="fields">
                        <label class="field"><span data-i18n="fontBidi"></span><select data-setting="fonts.bidi"></select></label>
                        <label class="field"><span data-i18n="fontLatin"></span><select data-setting="fonts.latin" data-font-check="#nf-latin"></select></label>
                        <div class="field" id="nf-latin" hidden><span class="hint warn" data-i18n="notInstalled"></span></div>
                        <label class="field"><span data-i18n="codeFont"></span><select data-setting="code.font"></select></label>
                        <div class="row3">
                            <label class="field"><span data-i18n="sizeBidi"></span><input type="number" min="6" max="36" step="0.5" dir="ltr" data-setting="fonts.bidiSize"></label>
                            <label class="field"><span data-i18n="sizeLatin"></span><input type="number" min="6" max="36" step="0.5" dir="ltr" data-setting="fonts.latinSize"></label>
                            <label class="field"><span data-i18n="codeSize"></span><input type="number" min="6" max="24" step="0.5" dir="ltr" data-setting="code.size"></label>
                        </div>
                        <div class="field"><span class="hint" data-i18n="fontsHint"></span></div>
                        <label class="check"><input type="checkbox" data-setting="fonts.wordOwn"><span data-i18n="fontsWordOwn"></span></label>
                        <div class="fields" id="word-fonts" hidden>
                            <div class="field"><span class="label-row"><label for="f-word-bidi" data-i18n="fontBidi"></label>
                                <button class="mini" type="button" data-reset="fonts.wordBidi" hidden data-i18n-attr="title:resetDefault;aria-label:resetDefault"><i data-lucide="rotate-ccw"></i></button></span>
                                <input type="text" id="f-word-bidi" dir="auto" list="dl-word-fonts" data-setting="fonts.wordBidi" data-font-check="#nf-word-bidi"></div>
                            <div class="field" id="nf-word-bidi" hidden><span class="hint danger" data-i18n="notInstalledWord"></span></div>
                            <div class="field"><span class="label-row"><label for="f-word-latin" data-i18n="fontLatin"></label>
                                <button class="mini" type="button" data-reset="fonts.wordLatin" hidden data-i18n-attr="title:resetDefault;aria-label:resetDefault"><i data-lucide="rotate-ccw"></i></button></span>
                                <input type="text" id="f-word-latin" dir="auto" list="dl-word-fonts" data-setting="fonts.wordLatin" data-font-check="#nf-word-latin"></div>
                            <div class="field" id="nf-word-latin" hidden><span class="hint danger" data-i18n="notInstalledWord"></span></div>
                            <label class="field"><span data-i18n="codeFont"></span>
                                <input type="text" dir="auto" list="dl-word-code-fonts" data-setting="code.wordFont" data-font-check="#nf-word-code" data-i18n-attr="placeholder:fontsAsAbove"></label>
                            <div class="field" id="nf-word-code" hidden><span class="hint danger" data-i18n="notInstalledWord"></span></div>
                            <div class="field"><span class="hint" data-i18n="fontsWordHint"></span></div>
                        </div>
                        <!-- fonts to install for Word and PowerPoint (Kelk.config.wordFontPacks, by interface language) -->
                        <div class="field font-pack" id="word-font-pack" hidden>
                            <span class="hint" data-i18n="wordFontsGetHint"></span>
                            <div class="btn-row">
                                <a class="btn soft" id="word-font-zip" download><i data-lucide="download"></i><span data-i18n="wordFontsGet"></span></a>
                                <a class="btn ghost font-site" target="_blank" rel="noopener noreferrer" hidden><i data-lucide="external-link"></i><span></span></a>
                                <a class="btn ghost font-site" target="_blank" rel="noopener noreferrer" hidden><i data-lucide="external-link"></i><span></span></a>
                            </div>
                        </div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="pilcrow"></i><span data-i18n="gText"></span></summary>
                    <div class="fields">
                        <!-- paragraphs (and list items: alignment) in every output; template textAlign / lineHeight -->
                        <div class="row2">
                            <label class="field"><span data-i18n="textAlign"></span>
                                <select data-setting="text.align">
                                    <option value="justify" data-i18n="alignJustify"></option>
                                    <option value="start" data-i18n="alignStart"></option>
                                </select></label>
                            <label class="field"><span data-i18n="lineSpacing"></span>
                                <select data-setting="text.lineHeight">

<!-- several documents (a zip, a multi-file drop): their order, which ones, and what cannot come in (Kelk.ui.order) -->
<dialog id="order" class="task order" aria-labelledby="order-label">
    <div class="dlg-body">
        <div class="task-label" id="order-label" dir="auto"></div>
        <div class="task-detail" id="order-detail" data-i18n="orderHint"></div>
        <ol class="order-list" id="order-list"></ol>
        <div class="order-skip" id="order-skip" hidden>
            <div class="order-skip-head" id="order-skip-head"></div>
            <ul class="order-list off" id="order-skip-list"></ul>
        </div>
        <div class="task-actions">
            <button class="btn ghost" id="order-sort" type="button"><i data-lucide="arrow-down-a-z"></i><span data-i18n="orderSort"></span></button>
            <span class="order-count" id="order-count"></span>
            <button class="btn" id="order-cancel" type="button"><i data-lucide="x"></i><span data-i18n="taskCancel"></span></button>
            <button class="btn primary" id="order-ok" type="button"><i data-lucide="file-up"></i><span data-i18n="orderImport"></span></button>
        </div>
    </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
    <div class="dlg-head">
        <h2 id="help-title" data-i18n="shortcuts"></h2>
        <button class="btn ghost icon" id="help-close" type="button" data-i18n-attr="aria-label:close"><i data-lucide="x"></i></button>
    </div>
    <div class="dlg-body">
        <table>
            <tr><td><kbd>Ctrl</kbd> + <kbd>S</kbd></td><td data-i18n="kMd"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Enter</kbd></td><td data-i18n="kDocx"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd></td><td data-i18n="kPdf"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>Enter</kbd></td><td data-i18n="kPptx"></td></tr>
            <tr><td><kbd>F5</kbd></td><td data-i18n="kPresent"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>O</kbd></td><td data-i18n="kOpen"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>V</kbd></td><td data-i18n="kPastePlain"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Z</kbd></td><td data-i18n="kUndo"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Y</kbd> / <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd></td><td data-i18n="kRedo"></td></tr>
            <tr><td><kbd>Tab</kbd> / <kbd>Shift</kbd> + <kbd>Tab</kbd></td><td data-i18n="kTab"></td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>,</kbd></td><td data-i18n="kSettings"></td></tr>
            <tr><td><kbd>F1</kbd></td><td data-i18n="kHelp"></td></tr>
        </table>
    </div>
</dialog>
