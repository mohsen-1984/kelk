<body>
<div class="app">

    <!-- ═══ top bar ═══ -->
    <header class="topbar">
        <div class="brand">
            <div class="glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                    <path d="M5 19 L15 5 L19 8 L9 22 Z" fill="currentColor" fill-opacity=".25"/>
                    <path d="M5 19 L4 23 L9 22"/>
                    <path d="M12 9 L16 12"/>
                </svg>
            </div>
            <div>
                <h1 data-i18n="appName">کِلک</h1>
                <div class="sub" data-i18n="tagline"></div>
            </div>
        </div>
        <div class="spacer"></div>
        <span class="lang-switch" id="lang-switch" role="group" aria-label="Language"><i data-lucide="languages"></i></span>
        <button class="btn ghost icon" id="btn-theme" type="button" data-i18n-attr="title:theme;aria-label:theme"></button>
        <button class="btn ghost icon layout-toggle" id="btn-layout" type="button"></button>
        <button class="btn ghost icon" id="btn-help" type="button" data-i18n-attr="title:help;aria-label:help"><i data-lucide="keyboard"></i></button>
    </header>

    <!-- ═══ workspace ═══ -->
    <main class="workspace" id="workspace">

        <!-- editor -->
        <section class="panel editor-panel" aria-labelledby="h-editor">
            <button class="rail" id="editor-rail" type="button" aria-controls="editor-body" data-i18n-attr="title:openEditor;aria-label:openEditor">
                <span class="flip-rtl"><i data-lucide="panel-left-open"></i></span><span class="rail-label" data-i18n="editor"></span>
            </button>
            <div class="panel-head pane-head">
                <h2 id="h-editor"><i data-lucide="pencil-line"></i><span data-i18n="editor"></span></h2>
                <div class="actions">
                    <button class="btn ghost icon" id="btn-sample" type="button" data-i18n-attr="title:sampleHint;aria-label:sampleHint"><i data-lucide="book-open"></i></button>
                    <button class="btn" id="btn-import" type="button"><i data-lucide="file-up"></i><span data-i18n="import"></span></button>
                    <button class="btn" id="btn-paste" type="button"><i data-lucide="clipboard-paste"></i><span data-i18n="paste"></span></button>
                    <button class="btn ghost icon" id="btn-replace" type="button" data-i18n-attr="title:replacePaste;aria-label:replacePaste"><i data-lucide="replace-all"></i></button>
                    <button class="btn ghost icon" id="btn-copy-editor" type="button" data-i18n-attr="title:copyMd;aria-label:copyMd"><i data-lucide="copy"></i></button>
                    <button class="btn ghost icon btn-max" id="max-editor" type="button" data-max="editor" data-i18n-attr="title:maximize;aria-label:maximize"><i data-lucide="maximize-2"></i></button>
                    <button class="btn soft danger icon" id="btn-clear" type="button" data-i18n-attr="title:clear;aria-label:clear"><i data-lucide="eraser"></i></button>
                </div>
            </div>
            <div class="pane-body editor-body" id="editor-body">
                <div class="editor-wrap">
                    <textarea id="editor" dir="auto" spellcheck="false" data-i18n-attr="placeholder:editorPlaceholder;aria-label:editor"></textarea>
                    <div class="dropzone-overlay"><span data-i18n="dropHere"></span></div>
                </div>
                <div class="panel-foot editor-foot">
                    <div class="stats" aria-live="polite">
                        <span><span data-i18n="words"></span>: <b id="st-words">0</b></span>
                        <span><span data-i18n="chars"></span>: <b id="st-chars">0</b></span>
                        <span><span data-i18n="size"></span>: <b id="st-size" dir="ltr">0 KB</b></span>
                        <span id="st-file" hidden><span data-i18n="file"></span>: <b id="st-file-name" dir="auto"></b></span>
                    </div>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn soft" id="btn-md" type="button" data-export="md" data-i18n-attr="title:mdHint"><i data-lucide="file-down"></i>MD</button>
                </div>
            </div>
            <input type="file" id="file-import" hidden accept=".md,.markdown,.txt,.html,.htm,.docx,text/markdown,text/plain,text/html">
        </section>

        <!-- preview -->
        <section class="panel preview-panel" aria-labelledby="h-preview">
            <div class="panel-head">
                <h2 id="h-preview"><i data-lucide="eye"></i><span data-i18n="preview"></span></h2>
                <div class="actions">
                    <button class="btn ghost icon" id="btn-copy-preview" type="button" data-i18n-attr="title:copy;aria-label:copy"><i data-lucide="copy"></i></button>
                    <button class="btn ghost icon btn-max" id="max-preview" type="button" data-max="preview" data-i18n-attr="title:maximize;aria-label:maximize"><i data-lucide="maximize-2"></i></button>
                </div>
            </div>
            <div class="preview-scroll">
                <article id="preview" class="doc" data-i18n-attr="data-empty:previewEmpty"></article>
            </div>
            <div class="panel-foot export-foot">
                <div class="namebox" data-i18n-attr="title:fileName">
                    <input class="stem" id="nb-stem" dir="auto" spellcheck="false" data-i18n-attr="aria-label:fileName">
                    <span class="ext" aria-disabled="true" data-i18n-attr="title:extHint"><span id="nb-ext">.docx</span></span>
                </div>
                <div class="export-bar" role="group" data-i18n-attr="aria-label:exportAs">
                    <button class="btn primary" type="button" data-export="docx" data-i18n-attr="title:docxHint"><i data-lucide="file-text"></i>DOCX</button>
                    <button class="btn soft" type="button" data-export="pdf" data-i18n-attr="title:pdfHint"><i data-lucide="file-type"></i>PDF</button>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn" type="button" data-export="html" data-i18n-attr="title:htmlHint"><i data-lucide="code-xml"></i>HTML</button>
                    <button class="btn ghost" type="button" data-export="doc" data-i18n-attr="title:docHint"><i data-lucide="file"></i>DOC</button>
                </div>
            </div>
        </section>

        <!-- settings (export profile) -->
        <aside class="panel settings" aria-labelledby="h-settings">
            <button class="rail" id="pane-rail" type="button" aria-controls="pane-body" data-i18n-attr="title:openSettings;aria-label:openSettings">
                <i data-lucide="sliders-horizontal"></i><span class="rail-label" data-i18n="settings"></span>
            </button>
            <div class="panel-head pane-head">
                <h2 id="h-settings"><i data-lucide="sliders-horizontal"></i><span data-i18n="settings"></span></h2>
                <div class="actions">
                    <span class="btn-pair">
                        <button class="btn ghost icon" id="groups-open" type="button" data-i18n-attr="title:expandAll;aria-label:expandAll"><i data-lucide="square-chevron-down"></i></button>
                        <button class="btn ghost icon" id="groups-close" type="button" data-i18n-attr="title:collapseAll;aria-label:collapseAll"><i data-lucide="square-chevron-up"></i></button>
                    </span>
                    <span class="sep" aria-hidden="true"></span>
                    <button class="btn ghost icon pane-toggle" id="pane-close" type="button" data-i18n-attr="title:closeSettings;aria-label:closeSettings"><span class="flip-rtl"><i data-lucide="panel-right-close"></i></span></button>
                </div>
            </div>
            <div class="pane-body" id="pane-body">

                <details class="group">
                    <summary><i data-lucide="file-text"></i><span data-i18n="gDocument"></span></summary>
                    <div class="fields">
                        <div class="field"><span class="label-row"><label for="f-title" data-i18n="docTitle"></label>
                            <button class="mini" type="button" data-reset="document.title" hidden data-i18n-attr="title:resetDefault;aria-label:resetDefault"><i data-lucide="rotate-ccw"></i></button></span>
                            <input type="text" id="f-title" dir="auto" data-setting="document.title"></div>
                        <div class="row2">
                            <div class="field"><span class="label-row"><label for="f-edition" data-i18n="docEdition"></label>
                                <button class="mini" type="button" data-reset="document.edition" hidden data-i18n-attr="title:editionReset;aria-label:editionReset"><i data-lucide="rotate-ccw"></i></button></span>
                                <input type="text" id="f-edition" dir="auto" data-setting="document.edition"></div>
                            <label class="field"><span data-i18n="docAuthor"></span><input type="text" dir="auto" data-setting="document.author"></label>
                        </div>
                        <label class="field"><span data-i18n="docLink"></span><input type="text" dir="ltr" data-setting="document.link" placeholder="example.com / name@example.com"></label>
                        <div class="field"><span class="hint" data-i18n="optional"></span></div>
                        <label class="field"><span data-i18n="docDirection"></span>
                            <select data-setting="direction">
                                <option value="auto" data-i18n="dirAuto"></option>
                                <option value="rtl" data-i18n="dirRtl"></option>
                                <option value="ltr" data-i18n="dirLtr"></option>
                            </select></label>
                        <div class="row2">
                            <label class="check"><input type="checkbox" data-setting="toc.enabled"><span data-i18n="tocEnabled"></span></label>
                            <label class="field"><span data-i18n="tocLevels"></span>
                                <select data-setting="toc.levels"><option value="1">H1</option><option value="2">H1–H2</option><option value="3">H1–H3</option></select></label>
                        </div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="type"></i><span data-i18n="gText"></span></summary>
                    <div class="fields">
                        <label class="field"><span data-i18n="fontBidi"></span><select data-setting="fonts.bidi"></select></label>
                        <label class="field"><span data-i18n="fontLatin"></span><select data-setting="fonts.latin"></select></label>
                        <div class="row2">
                            <label class="field"><span data-i18n="sizeBidi"></span><input type="number" min="6" max="36" step="0.5" dir="ltr" data-setting="fonts.bidiSize"></label>
                            <label class="field"><span data-i18n="sizeLatin"></span><input type="number" min="6" max="36" step="0.5" dir="ltr" data-setting="fonts.latinSize"></label>
                        </div>
                        <div class="field"><span class="hint"><span data-i18n="textFontsHint"></span>
                            <button type="button" class="link-btn" data-open-group="gWord" data-i18n="gWord"></button></span></div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="code"></i><span data-i18n="gCode"></span></summary>
                    <div class="fields">
                        <label class="field"><span data-i18n="codeFont"></span><select data-setting="code.font"></select></label>
                        <div class="row2">
                            <label class="field"><span data-i18n="codeSize"></span><input type="number" min="6" max="24" step="0.5" dir="ltr" data-setting="code.size"></label>
                        </div>
                        <label class="check"><input type="checkbox" data-setting="code.showLanguage"><span data-i18n="showLanguage"></span></label>
                        <label class="field"><span data-i18n="rtlInCode"></span>
                            <select data-setting="code.rtlFont"><option value="code" data-i18n="rtlInCodeCode"></option><option value="document" data-i18n="rtlInCodeDoc"></option></select></label>
                        <div class="sub-head label-row"><span data-i18n="colorsHead"></span>
                            <button class="mini" type="button" hidden data-reset-keys="code.bg,code.headerBg,code.border" data-i18n-attr="title:colorsReset;aria-label:colorsReset"><i data-lucide="rotate-ccw"></i></button></div>
                        <div class="row3">
                            <label class="field color"><span data-i18n="codeBg"></span><input type="color" data-setting="code.bg"></label>
                            <label class="field color"><span data-i18n="codeHeaderBg"></span><input type="color" data-setting="code.headerBg"></label>
                            <label class="field color"><span data-i18n="codeBorder"></span><input type="color" data-setting="code.border"></label>
                        </div>
                        <div class="field"><span class="hint" data-i18n="codeColorsHint"></span></div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="text-quote"></i><span data-i18n="gQuote"></span></summary>
                    <div class="fields">
                        <div class="sub-head label-row"><span data-i18n="quoteBar"></span>
                            <button class="mini" type="button" hidden data-reset-keys="quote.border,quote.width,quote.bg,quote.text" data-i18n-attr="title:colorsReset;aria-label:colorsReset"><i data-lucide="rotate-ccw"></i></button></div>
                        <div class="row2">
                            <label class="field color"><span data-i18n="quoteBorder"></span><input type="color" data-setting="quote.border"></label>
                            <label class="field"><span data-i18n="quoteWidth"></span>
                                <select data-setting="quote.width"><option value="2pt" data-i18n="widthThin"></option><option value="3.5pt" data-i18n="widthMedium"></option><option value="5pt" data-i18n="widthThick"></option></select></label>
                        </div>
                        <div class="row2">
                            <label class="field color"><span data-i18n="quoteBg"></span><input type="color" data-setting="quote.bg"></label>
                            <label class="field color"><span data-i18n="quoteText"></span><input type="color" data-setting="quote.text"></label>
                        </div>
                        <div class="field"><span class="hint" data-i18n="quoteHint"></span></div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="table"></i><span data-i18n="gTable"></span></summary>
                    <div class="fields">
                        <label class="field"><span data-i18n="tableWidth"></span>
                            <select data-setting="page.tableWidth">
                                <option value="auto" data-i18n="tableWidthAuto"></option>
                                <option value="100%">100%</option><option value="98%">98%</option>
                                <option value="90%">90%</option><option value="75%">75%</option><option value="50%">50%</option>
                            </select></label>
                        <label class="field"><span data-i18n="tableAlign"></span>
                            <select data-setting="page.tableAlign">
                                <option value="center" data-i18n="tableAlignCenter"></option>
                                <option value="text" data-i18n="tableAlignText"></option>
                                <option value="right" data-i18n="tableAlignRight"></option>
                                <option value="left" data-i18n="tableAlignLeft"></option>
                            </select></label>
                        <div class="field"><span class="hint" data-i18n="tableNestedHint"></span></div>
                        <div class="sub-head label-row"><span data-i18n="tableStyle"></span>
                            <button class="mini" type="button" hidden data-reset-keys="tableStyle.lines,tableStyle.fill,tableStyle.headerCenter,tableStyle.headerBold,tableStyle.total,tableStyle.headerColor,tableStyle.stripeColor,tableStyle.borderColor" data-i18n-attr="title:tsReset;aria-label:tsReset"><i data-lucide="rotate-ccw"></i></button></div>
                        <div class="row2">
                            <label class="field"><span data-i18n="tsLines"></span>
                                <select data-setting="tableStyle.lines">
                                    <option value="none" data-i18n="tlNone"></option>
                                    <option value="underline" data-i18n="tlUnderline"></option>
                                    <option value="horizontal" data-i18n="tlHorizontal"></option>
                                    <option value="vertical" data-i18n="tlVertical"></option>
                                    <option value="frame" data-i18n="tlFrame"></option>
                                    <option value="grid" data-i18n="tlGrid"></option>
                                </select></label>
                            <label class="field"><span data-i18n="tsFill"></span>
                                <select data-setting="tableStyle.fill">
                                    <option value="none" data-i18n="tfNone"></option>
                                    <option value="header" data-i18n="tfHeader"></option>
                                    <option value="stripes" data-i18n="tfStripes"></option>
                                    <option value="header-stripes" data-i18n="tfHeaderStripes"></option>
                                </select></label>
                        </div>
                        <div class="row3">
                            <label class="field color"><span data-i18n="tsHeaderColor"></span><input type="color" data-setting="tableStyle.headerColor"></label>
                            <label class="field color"><span data-i18n="tsStripeColor"></span><input type="color" data-setting="tableStyle.stripeColor"></label>
                            <label class="field color"><span data-i18n="tsBorderColor"></span><input type="color" data-setting="tableStyle.borderColor"></label>
                        </div>
                        <label class="check"><input type="checkbox" data-setting="tableStyle.headerCenter"><span data-i18n="tsHeaderCenter"></span></label>
                        <label class="check"><input type="checkbox" data-setting="tableStyle.headerBold"><span data-i18n="tsHeaderBold"></span></label>
                        <label class="check"><input type="checkbox" data-setting="tableStyle.total"><span data-i18n="tsTotal"></span></label>
                        <div class="field"><span class="hint" data-i18n="tsColorsHint"></span></div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="sigma"></i><span data-i18n="gMath"></span></summary>
                    <div class="fields">
                        <div class="field"><span class="hint" dir="auto" data-i18n="mathHint"></span></div>
                        <div class="sub-head" id="sh-math-web" data-i18n="mathWebHead"></div>
                        <div class="field"><span class="hint" data-i18n="mathWebHint"></span>
                            <select data-setting="math.html" aria-labelledby="sh-math-web"><option value="svg" data-i18n="mathHtmlSvg"></option><option value="mathml" data-i18n="mathHtmlMathml"></option></select></div>
                        <div class="sub-head" id="sh-math-word" data-i18n="mathWordHead"></div>
                        <div class="field"><span class="hint" data-i18n="mathWordHint"></span>
                            <select data-setting="math.word" aria-labelledby="sh-math-word"><option value="native" data-i18n="mathWordNative"></option><option value="image" data-i18n="mathWordImage"></option></select></div>
                    </div>
                </details>

                <details class="group">
                    <summary><i data-lucide="file-cog"></i><span data-i18n="gPageHeader"></span></summary>
                    <div class="fields">
                        <div class="field"><span class="hint" data-i18n="exportsOnly"></span></div>
                        <div class="row2">
                            <label class="field"><span data-i18n="pageSize"></span>
                                <select data-setting="page.size"><option>A4</option><option>A5</option><option>A3</option><option>Letter</option><option>Legal</option></select></label>
                            <label class="field"><span data-i18n="orientation"></span>
                                <select data-setting="page.orientation"><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></label>
                        </div>
                        <label class="field"><span data-i18n="margins"></span><input type="text" dir="ltr" data-setting="page.margin" placeholder="20mm 15mm"></label>

                        <div class="sub-head" data-i18n="gHeaderFooter"></div>
                        <label class="field"><span data-i18n="hfMode"></span>
                            <select data-setting="headerFooter.mode">
                                <option value="structured" data-i18n="hfStructured"></option>
                                <option value="simple" data-i18n="hfSimple"></option>
                                <option value="none" data-i18n="hfNone"></option>
                                <option value="custom" data-i18n="hfCustom"></option>
                            </select></label>
                        <label class="field"><span data-i18n="hfDirection"></span>
                            <select data-setting="headerFooter.direction">
                                <option value="rtl" data-i18n="dirRtl"></option>
                                <option value="ltr" data-i18n="dirLtr"></option>
                                <option value="auto" data-i18n="dirAuto"></option>
                            </select></label>
                        <div id="hf-custom" class="fields" hidden>
                            <div class="field"><span class="label-row"><label for="f-hf-header" data-i18n="customHeader"></label>
                                <button class="mini" type="button" data-reset="headerFooter.header" hidden data-i18n-attr="title:resetSample;aria-label:resetSample"><i data-lucide="rotate-ccw"></i></button></span>
                                <textarea id="f-hf-header" dir="ltr" data-setting="headerFooter.header" spellcheck="false"></textarea></div>
                            <div class="field"><span class="label-row"><label for="f-hf-footer" data-i18n="customFooter"></label>
                                <button class="mini" type="button" data-reset="headerFooter.footer" hidden data-i18n-attr="title:resetSample;aria-label:resetSample"><i data-lucide="rotate-ccw"></i></button></span>
                                <textarea id="f-hf-footer" dir="ltr" data-setting="headerFooter.footer" spellcheck="false"></textarea></div>
                            <div class="field"><span class="hint" data-i18n="customHint"></span></div>
                        </div>

                        <div class="sub-head" data-i18n="gLogo"></div>
                        <div class="logo-box" id="logo-box" tabindex="0">
                            <div class="thumb" id="logo-thumb"></div>
                            <div class="btns">
                                <label class="btn"><i data-lucide="upload"></i><span data-i18n="logoUpload"></span>
                                    <input type="file" id="logo-file" hidden accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif"></label>
                                <button class="btn ghost danger" id="logo-remove" type="button"><span data-i18n="logoRemove"></span></button>
                            </div>
                        </div>
