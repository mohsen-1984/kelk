# Dev tooling on every push and pull request: ESLint (npm run lint, eslint.config.js), the single version
# string (npm run check:version, tools/check-version.js), the interface strings (npm run check:i18n,
# tools/check-i18n.js; since P1.4) and the app's unit tests (npm test: tests/unit, Node's test runner + jsdom;
# since P1.1). A workflow of its own, not a job in pdf-lab.yml: that
# one runs only when the lab's paths change, this one on any change, and a lint failure never hides the lab's
# results. Prettier's format check is not here — .prettierrc encodes the style of the tree, but the tree is not
# formatted yet (plan P0.4).
#
# Same conventions as pdf-lab.yml: actions pinned to commit SHAs (the tag in the comment), read-only token,
# every step under bash -euo pipefail with its output teed to $RUNNER_TEMP/logs/<step>.log and uploaded.
# npm's download cache is keyed on package-lock.json; `npm ci` installs exactly the locked versions.
# All checks run even when another fails (!cancelled()), and each fails the job.
name: tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { lfs: false, persist-credentials: false }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }

      - name: Install (npm ci, package-lock.json's versions)
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          npm ci 2>&1 | tee "$RUNNER_TEMP/logs/install.log"

      - name: Lint (npm run lint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/logs/lint.log"

      - name: Version (npm run check:version)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:version 2>&1 | tee "$RUNNER_TEMP/logs/check-version.log"

      - name: Interface strings (npm run check:i18n — fa / en / ar, missing and unused keys)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:i18n 2>&1 | tee "$RUNNER_TEMP/logs/check-i18n.log"

      - name: Unit tests (npm test — tests/unit, Node's runner + jsdom)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/logs/unit-tests.log"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
